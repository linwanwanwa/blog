<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linwan's Blog</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤓</text></svg>">
  <meta name="description" content="Linwan 的个人博客：全栈开发、iOS 开发与技术笔记">
  <style>
    html,body{margin:0;min-height:100%}
    body{background:#0a0e14;color:#e6e8ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
    @media (prefers-color-scheme: light){body{background:#f5f5f5;color:#1a1a1a}}
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    #boot .ring{width:34px;height:34px;border:2px solid rgba(240,136,62,.22);border-top-color:#f0883e;border-radius:50%;animation:bootSpin .9s linear infinite}
    #boot .txt{font-size:10px;letter-spacing:.36em;opacity:.4}
    @keyframes bootSpin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){#boot .ring{animation:none}}
  </style>
</head>
<body>
  <div id="app">
    <div id="boot" aria-hidden="true"><span class="ring"></span><span class="txt">LINWAN</span></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
